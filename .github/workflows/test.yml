name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - run: go vet ./...

      # Runs the full suite, including readonly_test.go, which fails if any
      # filesystem-writing call is added to the scanner.
      - run: go test ./...
